<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進路ナビ｜学年を選んでください</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEBE4;
    --card:#F8F7F2;
    --ink:#252826;
    --ink-soft:#63675F;
    --line: rgba(37,40,38,0.14);

    --c1: #3D6B57; /* 1年生：地図の緑 */
    --c2: #C97A3D; /* 2年生：道のアンバー */
    --c3: #4A5B8C; /* 3年生：路線図の紺 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 10% 0%, rgba(61,107,87,0.08), transparent 40%),
      radial-gradient(ellipse at 90% 15%, rgba(201,122,61,0.07), transparent 45%),
      radial-gradient(ellipse at 50% 100%, rgba(74,91,140,0.06), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 28px; width:100%;}
  a{color:inherit;}

  header{padding:30px 0 0;}
  .school{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
    letter-spacing:.1em;
  }

  main{flex:1; display:flex; align-items:center; padding:50px 0 70px;}
  .intro{margin-bottom:52px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--ink-soft);}
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,5.4vw,48px);
    line-height:1.3; margin:0 0 16px; max-width:16ch;
  }
  .lede{font-size:15.5px; color:var(--ink-soft); max-width:52ch; margin:0;}

  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .card{
    display:block; text-decoration:none; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:30px 26px; position:relative; overflow:hidden;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:var(--accent);
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 14px 30px rgba(37,40,38,0.10); border-color:var(--accent);}
  .card .grade-num{
    font-family:'Fraunces',serif; font-style:italic; font-size:40px; font-weight:500;
    color:var(--accent); line-height:1; margin-bottom:16px; display:block;
  }
  .card h2{font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin:0 0 10px;}
  .card p{font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.6;}
  .card .go{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }

  .card.c1{--accent:var(--c1);}
  .card.c2{--accent:var(--c2);}
  .card.c3{--accent:var(--c3);}

  footer{padding:24px 0 30px; border-top:1px solid var(--line);}
  footer p{margin:0; font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  @media (max-width:760px){
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="school">○○高等学校</span>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro">
      <p class="eyebrow">進路ナビ</p>
      <h1>まずは、学年を<br>選んでください。</h1>
      <p class="lede">学年ごとに、今取り組むべきことが違います。自分の学年のサイトを選んでください。</p>
    </div>

    <div class="cards">
      <a class="card c1" href="site1/index.html">
        <span class="grade-num">01</span>
        <h2>1年生</h2>
        <p>自分を知り、視野を広げる。地図を広げて、進む道を選ぶ1年間。</p>
        <span class="go">1年生サイトへ →</span>
      </a>

      <a class="card c2" href="site2/index.html">
        <span class="grade-num">02</span>
        <h2>2年生</h2>
        <p>気になる分野を絞り、具体的に調べる。選んだ道を進んでいく1年間。</p>
        <span class="go">2年生サイトへ →</span>
      </a>

      <a class="card c3" href="site3/index.html">
        <span class="grade-num">03</span>
        <h2>3年生</h2>
        <p>志望理由書・面接対策など、出願に向けた実践の1年間。</p>
        <span class="go">3年生サイトへ →</span>
      </a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>進路指導部</p>
  </div>
</footer>

</body>
</html>
